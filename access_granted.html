<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ARCHIVE 17</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background: #000;

            color: #b8ffb8;

            font-family: "Courier New", monospace;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        a {
            color: #b8ffb8;

            font-size: 18px;

            text-decoration: none;

            border-bottom: 1px solid #b8ffb8;

            padding-bottom: 3px;

            transition: 0.2s;
        }

        a:hover {
            color: #fff;

            border-color: #fff;
        }
    </style>
</head>

<body>

    <a href="#">
        (ссылка)
    </a>

</body>
</html>
