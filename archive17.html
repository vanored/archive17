<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Не просто цифры</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background: #050505;
            color: #b8ffb8;

            font-family: "Courier New", monospace;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }

        .archive {
            width: 1000px;
            max-width: 95%;

            text-align: center;
        }

        h1 {
            margin: 0 0 50px;

            font-size: 32px;
            font-weight: normal;

            letter-spacing: 5px;
        }

        .numbers {
            padding: 35px;

            border: 1px solid #333;

            background: #080808;

            font-size: 22px;
            line-height: 2;

            letter-spacing: 3px;

            box-shadow:
                0 0 40px rgba(0, 255, 0, 0.05);
        }
    </style>
</head>

<body>

    <div class="archive">

        <h1>НЕ ПРОСТО ЦИФРЫ</h1>

        <div class="numbers">
            19 5 22 5 14 20 5 5 14 0 19 5 22 5 14 20 5 5 14
        </div>

    </div>

</body>
</html>
