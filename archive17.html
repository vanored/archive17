<!DOCTYPE html>
<html lang="ru">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Не просто цифры</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;
            min-height: 100vh;

            background: #050505;
            color: #b8ffb8;

            font-family: "Courier New", monospace;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;

        }

        .archive {

            width: 900px;
            max-width: 100%;

            text-align: center;

        }

        h1 {

            font-size: 32px;
            letter-spacing: 5px;

            font-weight: normal;

            margin-bottom: 40px;

        }

        .image-container {

            border: 1px solid #333;

            padding: 10px;

            background: #080808;

            box-shadow:
                0 0 40px rgba(0, 255, 0, 0.05);

        }

        .image-container img {

            display: block;

            width: 100%;
            height: auto;

        }

        .info {

            margin-top: 25px;

            color: #666;

            font-size: 14px;

        }

    </style>

</head>

<body>

<div class="archive">

    <h1>НЕ ПРОСТО ЦИФРЫ</h1>

    <div class="image-container">

        <img src="archive17" alt="Archive 17">

    </div>

    <div class="info">

        ARCHIVE 17 // FILE RECOVERED

    </div>

</div>

</body>
</html>
