<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ARCHIVE 17</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background: #050505;
            color: #b8ffb8;

            font-family: "Courier New", monospace;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .terminal {
            width: 800px;
            max-width: 90%;

            padding: 40px;

            background: #080808;
            border: 1px solid #333;

            box-shadow:
                0 0 40px rgba(0, 255, 0, 0.05);
        }

        .header {
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        }

        h1 {
            margin: 0 0 30px;

            font-size: 28px;
            letter-spacing: 4px;
        }

        .line {
            height: 1px;
            background: #222;

            margin: 25px 0;
        }

        .message {
            color: #b8ffb8;
            font-size: 18px;
            line-height: 1.8;
        }

        .numbers {
            margin-top: 25px;

            color: #b8ffb8;

            font-size: 20px;
            line-height: 2;

            word-break: break-word;
        }

        .warning {
            margin-top: 35px;

            color: #555;

            font-size: 13px;
        }

        .cursor {
            display: inline-block;

            width: 8px;
            height: 16px;

            margin-top: 25px;

            background: #b8ffb8;

            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }
    </style>
</head>

<body>

<div class="terminal">

    <div class="header">
        ARCHIVE 17 // FILE 001
    </div>

    <h1>ARCHIVE 17</h1>

    <div class="line"></div>

    <div class="message">
        НЕ ПРОСТО ЦИФРЫ
    </div>

    <div class="numbers">
        19,5,22,5,14,20,5,5,14, ,19,5,22,5,14,20,5,5,14.
    </div>

    <div class="line"></div>

    <div class="warning">
        [ DATA CORRUPTED ]
    </div>

    <span class="cursor"></span>

</div>

</body>
</html>
