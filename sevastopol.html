
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ARCHIVE 17</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background: #050505;
            color: #b8ffb8;

            font-family: "Courier New", monospace;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .terminal {
            width: 800px;
            max-width: 90%;

            padding: 40px;

            background: #080808;
            border: 1px solid #333;

            box-shadow:
                0 0 40px rgba(0, 255, 0, 0.05);
        }

        h1 {
            margin: 0 0 10px;

            font-size: 28px;
            letter-spacing: 4px;
        }

        .subtitle {
            color: #555;
            margin-bottom: 30px;
        }

        .line {
            height: 1px;
            background: #222;

            margin: 25px 0;
        }

        .doors {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .door {
            display: block;

            color: #777;
            text-decoration: none;

            padding: 8px 10px;

            border-left: 1px solid transparent;

            transition: 0.15s;
        }

        .door:hover {
            color: #b8ffb8;
            border-left: 1px solid #b8ffb8;
            background: #0b100b;
        }

        .cursor {
            display: inline-block;

            width: 8px;
            height: 16px;

            margin-top: 25px;

            background: #b8ffb8;

            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }
    </style>
</head>
