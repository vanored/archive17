<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ARCHIVE 17</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background: #000;
            color: #b8ffb8;

            font-family: "Courier New", monospace;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .terminal {
            text-align: center;

            width: 700px;
            max-width: 90%;

            padding: 40px;
        }

        .question {
            font-size: 20px;

            margin-bottom: 40px;

            letter-spacing: 1px;
        }

        .buttons {
            display: flex;

            justify-content: center;

            gap: 25px;
        }

        button {
            width: 100px;

            padding: 12px 20px;

            background: transparent;

            border: 1px solid #444;

            color: #b8ffb8;

            font-family: "Courier New", monospace;

            font-size: 15px;

            cursor: pointer;

            transition: 0.2s;
        }

        button:hover {
            border-color: #b8ffb8;

            background: #0b100b;
        }

        #message {
            margin-top: 30px;

            min-height: 20px;

            color: #555;

            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="terminal">

    <div class="question">
        Do you really want to open archive 17?
    </div>

    <div class="buttons">

        <button onclick="openArchive()">
            [YES]
        </button>

        <button onclick="nothing()">
            [NO]
        </button>

    </div>

    <div id="message"></div>

</div>

<script>

function openArchive() {

    window.location.href = "access_granted.html";

}

function nothing() {

    // Ничего не происходит.

}

</script>

</body>
</html>
