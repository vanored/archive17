<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BENEATH</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;

            background: #050505;
            color: #b8ffb8;

            font-family: "Courier New", monospace;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            width: 800px;
            max-width: 90%;

            padding: 40px;

            border: 1px solid #333;

            background: #080808;

            text-align: center;
        }

        .title {
            font-size: 55px;
            letter-spacing: 12px;

            margin-bottom: 30px;
        }

        .hint {
            font-size: 18px;

            color: #888;

            margin-bottom: 30px;
        }

        .numbers {
            text-align: left;

            padding: 25px;

            border: 1px solid #333;

            font-size: 18px;

            line-height: 2;
        }
    </style>
</head>

<body>

<div class="box">

    <div class="title">
        BENEATH
    </div>

    <div class="hint">
        Сравни число с тем, как оно пишется.
    </div>

    <div class="numbers">

        1 — один<br>
        2 — два<br>
        3 — три<br>
        4 — четыре<br>
        5 — пять<br>
        6 — шесть<br>
        7 — семь<br>
        8 — восемь<br>
        9 — девять<br>
        10 — десять

    </div>

</div>

</body>
</html>
