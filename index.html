<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ARCHIVE 17</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background: #050505;
            color: #b8ffb8;

            font-family: "Courier New", monospace;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .terminal {
            width: 700px;
            max-width: 90%;

            padding: 35px;

            border: 1px solid #333;
            background: #080808;

            box-shadow:
                0 0 40px rgba(0, 255, 0, 0.05);
        }

        h1 {
            margin: 0 0 10px;

            font-size: 32px;
            letter-spacing: 5px;
        }

        .line {
            height: 1px;
            background: #222;

            margin: 25px 0;
        }

        .status {
            color: #777;
            line-height: 1.8;
        }

        .green {
            color: #b8ffb8;
        }

        button {
            margin-top: 30px;

            padding: 12px 25px;

            background: transparent;
            border: 1px solid #555;

            color: #b8ffb8;

            font-family: "Courier New", monospace;
            font-size: 15px;

            cursor: pointer;
        }

        button:hover {
            background: #101510;
            border-color: #b8ffb8;
        }

        #accessBox {
            display: none;
            margin-top: 25px;
        }

        #codeInput {
            width: 100%;
            padding: 12px;

            background: #050505;
            border: 1px solid #444;

            color: #b8ffb8;

            font-family: "Courier New", monospace;
            font-size: 15px;

            outline: none;
        }

        #codeInput:focus {
            border-color: #b8ffb8;
        }

        #message {
            margin-top: 15px;

            min-height: 25px;

            color: #888;
        }

        .cursor {
            display: inline-block;

            width: 8px;
            height: 16px;

            background: #b8ffb8;

            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }
    </style>
</head>

<body>

<div class="terminal">

    <h1>ARCHIVE 17</h1>

    <div class="green">
        RECOVERY SYSTEM
    </div>

    <div class="line"></div>

    <div class="status">

        DATABASE:
        <span class="green">DAMAGED</span>

        <br>

        FILES RECOVERED:
        <span class="green">37%</span>

        <br>

        SYSTEM STATUS:
        <span class="green">ONLINE</span>

        <br>

        ACCESS:
        <span class="green">RESTRICTED</span>

    </div>

    <div class="line"></div>

    <button onclick="enterArchive()">
        ENTER
    </button>

    <div id="accessBox">

        <div class="green">
            ENTER ACCESS CODE:
        </div>

        <br>

        <input
            type="text"
            id="codeInput"
            placeholder="/archive17/"
            autocomplete="off"
            onkeydown="checkCode(event)"
        >

        <div id="message"></div>

    </div>

    <span class="cursor"></span>

</div>

<script>

function enterArchive() {

    document.getElementById("accessBox").style.display = "block";

    document.getElementById("codeInput").focus();

}

function checkCode(event) {

    if (event.key === "Enter") {

        const code =
            document.getElementById("codeInput").value.trim();

        if (code === "/archive17/") {

            window.location.href = "archive17.html";

        }

        else if (code === "/beneath/") {

            window.location.href = "beneath.html";

        }

        else {

            document.getElementById("message").innerHTML =
                "ACCESS DENIED";

        }

    }

}

</script>

</body>
</html>
